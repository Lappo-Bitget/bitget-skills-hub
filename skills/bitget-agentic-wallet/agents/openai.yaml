interface:
  display_name: "Bitget Agentic Wallet"
  short_description: "Morph wallet, Agent ID, and Hardhat deployments"
  default_prompt: "For wallet connection or QR requests, first call mcp__bitget_morph_wallet__connect_wallet and render its returned PNG image; never claim a QR exists without an image. Use $bitget-agentic-wallet in lightweight mode, or explicitly enable developer mode for a reviewed Bitget Wallet or Hardhat deployment."
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: "mcp"
      value: "bitget-morph-wallet"
      description: "Local WalletConnect bridge for user-approved Bitget Wallet sessions on Morph"
      transport: "stdio"
